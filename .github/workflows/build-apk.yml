name: Build VUV Kisan Seva APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Least-privilege permission: this workflow only needs to read repository files.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7 esbuild

      - name: Prepare app files
        run: |
          mkdir -p assets www

          if [ ! -f assets/vuv-logo.png ]; then
            if [ -f vuv-logo.png ]; then
              cp vuv-logo.png assets/vuv-logo.png
            else
              echo "ERROR: VUV logo file is missing"
              exit 1
            fi
          fi

          if [ ! -f app-icon-photo.png ]; then
            echo "ERROR: app-icon-photo.png is missing from the repository root"
            exit 1
          fi

          if [ ! -f make-icons.py ]; then
            echo "ERROR: make-icons.py is missing from the repository root"
            exit 1
          fi

          if [ ! -f index.html ]; then
            echo "ERROR: index.html is missing"
            exit 1
          fi

          if [ ! -f back-handler.js ]; then
            echo "ERROR: back-handler.js is missing"
            exit 1
          fi

          cp index.html www/index.html
          mkdir -p www/assets
          cp -r assets/. www/assets/

      - name: Bundle Android back button handler
        run: |
          npx esbuild back-handler.js --bundle --format=iife --outfile=www/back-handler.js

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.vuv.kisanseva",
            "appName": "VUV Kisan Seva",
            "webDir": "www"
          }
          EOF

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Generate launcher icons from supplied photo
        run: |
          python -m pip install pillow
          python make-icons.py

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew

          # Gradle wrapper defaults to a 10-second download timeout.
          # Increase it to 2 minutes to handle slower download connections.
          if grep -q '^networkTimeout=' gradle/wrapper/gradle-wrapper.properties; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          else
            echo 'networkTimeout=120000' >> gradle/wrapper/gradle-wrapper.properties
          fi

          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VUV-Kisan-Seva-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
