name: Build VUV Kisan Seva APK

on:
  # APK builds are manual until permanent signing is configured.
  workflow_dispatch:

# Least-privilege permission: this workflow only needs to read repository files.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check app structure and safety rules
        run: node scripts/check-app.mjs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7 esbuild

      - name: Prepare app files
        run: |
          mkdir -p assets www

          if [ ! -f assets/vuv-logo.png ]; then
            if [ -f vuv-logo.png ]; then
              cp vuv-logo.png assets/vuv-logo.png
            else
              echo "ERROR: VUV logo file is missing"
              exit 1
            fi
          fi

          if [ ! -f app-icon-photo.png ]; then
            echo "ERROR: app-icon-photo.png is missing from the repository root"
            exit 1
          fi

          if [ ! -f make-icons.py ]; then
            echo "ERROR: make-icons.py is missing from the repository root"
            exit 1
          fi

          if [ ! -f index.html ]; then
            echo "ERROR: index.html is missing"
            exit 1
          fi

          if [ ! -f back-handler.js ]; then
            echo "ERROR: back-handler.js is missing"
            exit 1
          fi

          cp index.html www/index.html
          mkdir -p www/assets
          cp -r assets/. www/assets/

      - name: Bundle Android back button handler
        run: |
          npx esbuild back-handler.js --bundle --format=iife --outfile=www/back-handler.js

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.vuv.kisanseva",
            "appName": "VUV Kisan Seva",
            "webDir": "www"
          }
          EOF

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Generate launcher icons from supplied photo
        run: |
          python -m pip install pillow
          python make-icons.py

      - name: Configure permanent APK signing
        working-directory: android
        env:
          VUV_KEYSTORE_BASE64: ${{ secrets.VUV_KEYSTORE_BASE64 }}
          VUV_KEYSTORE_PASSWORD: ${{ secrets.VUV_KEYSTORE_PASSWORD }}
          VUV_KEY_ALIAS: ${{ secrets.VUV_KEY_ALIAS }}
          VUV_KEY_PASSWORD: ${{ secrets.VUV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in VUV_KEYSTORE_BASE64 VUV_KEYSTORE_PASSWORD VUV_KEY_ALIAS VUV_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}. Add all four VUV signing secrets before building an update APK."
              exit 1
            fi
          done
          printf '%s' "$VUV_KEYSTORE_BASE64" | base64 --decode > app/vuv-release.keystore
          test -s app/vuv-release.keystore
          chmod 600 app/vuv-release.keystore
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("app/build.gradle")
          text = path.read_text()
          if "signingConfigs {" not in text:
              signing_block = """    signingConfigs {
                  release {
                      storeFile file("vuv-release.keystore")
                      storePassword System.getenv("VUV_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("VUV_KEY_ALIAS")
                      keyPassword System.getenv("VUV_KEY_PASSWORD")
                  }
              }

              """
              text, count = re.subn(
                  r"(    buildTypes\s*\{)",
                  lambda match: signing_block + match.group(1),
                  text, count=1
              )
              if count != 1:
                  raise SystemExit("Could not locate Android buildTypes block")
          text, count = re.subn(
              r"(buildTypes\s*\{\s*release\s*\{)",
              r"\1\n            signingConfig signingConfigs.release",
              text, count=1
          )
          if count != 1:
              raise SystemExit("Could not configure release signing")
          path.write_text(text)
          PY

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        run: |
          cd android
          chmod +x gradlew
          sed -i 's/-all\\.zip/-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          if grep -q '^networkTimeout=' gradle/wrapper/gradle-wrapper.properties; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          else
            echo 'networkTimeout=120000' >> gradle/wrapper/gradle-wrapper.properties
          fi
          for attempt in 1 2 3; do
            ./gradlew --no-daemon assembleRelease && exit 0
            echo "Gradle build attempt ${attempt} failed; retrying..."
            sleep 10
          done
          exit 1

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VUV-Kisan-Seva-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
