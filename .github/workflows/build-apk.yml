name: Build VUV Kisan Seva Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate app source
        run: node scripts/check-app.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7 esbuild

      - name: Prepare app files
        run: |
          mkdir -p assets www
          if [ ! -f assets/vuv-logo.png ]; then
            test -f vuv-logo.png || { echo "VUV logo missing"; exit 1; }
            cp vuv-logo.png assets/vuv-logo.png
          fi
          test -f app-icon-photo.png || { echo "App icon photo missing"; exit 1; }
          test -f make-icons.py || { echo "Icon generator missing"; exit 1; }
          test -f index.html || { echo "index.html missing"; exit 1; }
          test -f back-handler.js || { echo "Back handler missing"; exit 1; }
          cp index.html www/index.html
          mkdir -p www/assets
          cp -r assets/. www/assets/

      - name: Bundle Android back handler
        run: npx esbuild back-handler.js --bundle --format=iife --outfile=www/back-handler.js

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.vuv.kisanseva",
            "appName": "VUV Kisan Seva",
            "webDir": "www"
          }
          EOF
          npx cap add android

      - name: Generate launcher icons
        run: |
          python -m pip install pillow
          python make-icons.py

      - name: Configure persistent release signing
        env:
          VUV_KEYSTORE_BASE64: ${{ secrets.VUV_RELEASE_KEYSTORE_BASE64 }}
          VUV_STORE_PASSWORD: ${{ secrets.VUV_RELEASE_STORE_PASSWORD }}
          VUV_KEY_ALIAS: ${{ secrets.VUV_RELEASE_KEY_ALIAS }}
          VUV_KEY_PASSWORD: ${{ secrets.VUV_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$VUV_KEYSTORE_BASE64" ] || [ -z "$VUV_STORE_PASSWORD" ] || [ -z "$VUV_KEY_ALIAS" ] || [ -z "$VUV_KEY_PASSWORD" ]; then
            echo "::error::Add repository Actions secrets: VUV_RELEASE_KEYSTORE_BASE64, VUV_RELEASE_STORE_PASSWORD, VUV_RELEASE_KEY_ALIAS, VUV_RELEASE_KEY_PASSWORD"
            exit 1
          fi
          printf '%s' "$VUV_KEYSTORE_BASE64" | base64 --decode > android/app/vuv-release.jks
          test -s android/app/vuv-release.jks
          chmod 600 android/app/vuv-release.jks
          export VUV_KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/vuv-release.jks"
          export VUV_STORE_PASSWORD VUV_KEY_ALIAS VUV_KEY_PASSWORD
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if "signingConfigs.vuvRelease" in s:
              raise SystemExit("Release signing already configured unexpectedly")
          signing = """
              signingConfigs {
                  vuvRelease {
                      storeFile file(System.getenv("VUV_KEYSTORE_PATH"))
                      storePassword System.getenv("VUV_STORE_PASSWORD")
                      keyAlias System.getenv("VUV_KEY_ALIAS")
                      keyPassword System.getenv("VUV_KEY_PASSWORD")
                  }
              }
          """
          s, n = re.subn(r"(android\s*\{)", r"\1" + signing, s, count=1)
          if n != 1:
              raise SystemExit("Could not locate Android Gradle configuration")
          s, n = re.subn(r"(buildTypes\s*\{\s*release\s*\{)", r"\1\n            signingConfig signingConfigs.vuvRelease", s, count=1)
          if n != 1:
              raise SystemExit("Could not locate release build type")
          p.write_text(s)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and verify signed release APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          sed -i 's/-all\\.zip/-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          if grep -q '^networkTimeout=' gradle/wrapper/gradle-wrapper.properties; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          else
            echo 'networkTimeout=120000' >> gradle/wrapper/gradle-wrapper.properties
          fi
          ./gradlew --no-daemon assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p ../dist
          cp "$APK" ../dist/VUV-Kisan-Seva-Release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: VUV-Kisan-Seva-Release-APK
          path: dist/VUV-Kisan-Seva-Release.apk
          if-no-files-found: error
