name: Validate VUV Kisan Seva
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check required app files
        run: |
          test -s index.html
          test -s back-handler.js
          test -s make-icons.py
          test -s app-icon-photo.png
          test -s vuv-logo.png
      - name: Verify navigation, quiz, and farmer progress safeguards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          nav_match = re.search(r'<nav class="bottomnav"[^>]*>(.*?)</nav>', html, re.S)
          if not nav_match:
              raise SystemExit("Bottom navigation is missing")
          labels = re.findall(r'<span>([^<]+)</span></a>', nav_match.group(1))
          expected = ["सभी सेवाएँ", "सूचनाएँ", "मेरा खाता"]
          if labels != expected:
              raise SystemExit(f"Bottom navigation mismatch: {labels!r}")
          question_count = len(re.findall(r'\{q:', html))
          if question_count != 60:
              raise SystemExit(f"Expected 60 quiz questions, found {question_count}")
          for element_id in ("weeklyPoints", "monthlyPoints", "weeklyAttempts", "monthlyAttempts"):
              if f'id="{element_id}"' not in html:
                  raise SystemExit(f"Missing progress report field: {element_id}")
          for key in ("vuvFarmer", "vuvScore", "vuvAnswered", "vuvQuizHistory"):
              if key not in html:
                  raise SystemExit(f"Missing backup data key: {key}")
          print("Three navigation tabs, 60 quiz questions, progress report, and backup keys verified.")
          PY
      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.I)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/vuv-inline.js").write_text("\n;".join(inline), encoding="utf-8")
          PY
          node --check /tmp/vuv-inline.js
          node --check back-handler.js
      - name: Verify backup safeguards exist
        run: |
          grep -q 'function exportBackup' index.html
          grep -q 'function importBackup' index.html
          grep -q 'vuvFarmer' index.html
          grep -q 'vuvScore' index.html
          grep -q 'vuvAnswered' index.html
          grep -q '8726088430' index.html
          grep -q '7388799010' index.html
